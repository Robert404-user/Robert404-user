<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .box{fill:#0d1117;stroke:#30363d;stroke-width:1.5}
      .label{fill:#f0f6fc;font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}
      .sub{fill:#8b949e;font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}
      .line{stroke:#30363d;stroke-width:3;stroke-linecap:round}
      .pulse{fill:#22d3ee;filter:url(#glow)}
      .pulse2{fill:#8b5cf6;filter:url(#glow)}
      @keyframes p1{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(170px);opacity:0}}
      @keyframes p2{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(170px);opacity:0}}
      .a{animation:p1 2.4s linear infinite}
      .b{animation:p2 2.4s linear .8s infinite}
      .c{animation:p1 2.4s linear 1.6s infinite}
    </style>
  </defs>

  <rect x="35" y="48" rx="14" ry="14" width="150" height="84" class="box"/>
  <text x="110" y="82" class="label">🤖 AI Agent</text>
  <text x="110" y="105" class="sub">reason · plan · act</text>

  <rect x="245" y="48" rx="14" ry="14" width="150" height="84" class="box"/>
  <text x="320" y="82" class="label">🔌 MCP</text>
  <text x="320" y="105" class="sub">tools · context</text>

  <rect x="455" y="48" rx="14" ry="14" width="150" height="84" class="box"/>
  <text x="530" y="82" class="label">🧰 Tools</text>
  <text x="530" y="105" class="sub">APIs · files · servers</text>

  <rect x="665" y="48" rx="14" ry="14" width="200" height="84" class="box"/>
  <text x="765" y="82" class="label">🗂️ Real Context</text>
  <text x="765" y="105" class="sub">notes · data · services</text>

  <line x1="185" y1="90" x2="245" y2="90" class="line"/>
  <line x1="395" y1="90" x2="455" y2="90" class="line"/>
  <line x1="605" y1="90" x2="665" y2="90" class="line"/>

  <circle cx="195" cy="90" r="5" class="pulse a"/>
  <circle cx="405" cy="90" r="5" class="pulse2 b"/>
  <circle cx="615" cy="90" r="5" class="pulse c"/>

  <rect x="35" y="150" width="830" height="3" rx="1.5" fill="url(#g)" opacity=".65"/>
</svg>