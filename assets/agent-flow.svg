<svg xmlns="http://www.w3.org/2000/svg" width="900" height="180" viewBox="0 0 900 180">
  <defs>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.52" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .box{fill:#0d1117;stroke:#30363d;stroke-width:1.5}
      .label{fill:#f0f6fc;font:600 14.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}
      .sub{fill:#8b949e;font:11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-anchor:middle}
      .wire{stroke:#30363d;stroke-width:3;stroke-linecap:round}
      .node{fill:#22d3ee;filter:url(#glow)}
      .node2{fill:#8b5cf6;filter:url(#glow)}
      @keyframes hop1{
        0%,2%{transform:translateX(0);opacity:0}
        5%{opacity:1}
        25%{transform:translateX(50px);opacity:1}
        28%,100%{transform:translateX(50px);opacity:0}
      }
      @keyframes hop2{
        0%,30%{transform:translateX(0);opacity:0}
        33%{opacity:1}
        53%{transform:translateX(50px);opacity:1}
        56%,100%{transform:translateX(50px);opacity:0}
      }
      @keyframes hop3{
        0%,58%{transform:translateX(0);opacity:0}
        61%{opacity:1}
        81%{transform:translateX(50px);opacity:1}
        84%,100%{transform:translateX(50px);opacity:0}
      }
      .p1{animation:hop1 4.2s ease-in-out infinite}
      .p2{animation:hop2 4.2s ease-in-out infinite}
      .p3{animation:hop3 4.2s ease-in-out infinite}
    </style>
  </defs>

  <rect x="25" y="45" rx="14" ry="14" width="165" height="88" class="box"/>
  <text x="107.5" y="78" class="label">🤖 Agent Runtime</text>
  <text x="107.5" y="102" class="sub">reason · plan · tool calls</text>

  <rect x="250" y="45" rx="14" ry="14" width="165" height="88" class="box"/>
  <text x="332.5" y="78" class="label">🔌 MCP Layer</text>
  <text x="332.5" y="102" class="sub">discovery · context · routing</text>

  <rect x="475" y="45" rx="14" ry="14" width="165" height="88" class="box"/>
  <text x="557.5" y="78" class="label">🧰 Tools / APIs</text>
  <text x="557.5" y="102" class="sub">files · services · servers</text>

  <rect x="700" y="45" rx="14" ry="14" width="175" height="88" class="box"/>
  <text x="787.5" y="78" class="label">🗂️ Context + State</text>
  <text x="787.5" y="102" class="sub">notes · data · memory</text>

  <line x1="190" y1="89" x2="250" y2="89" class="wire"/>
  <line x1="415" y1="89" x2="475" y2="89" class="wire"/>
  <line x1="640" y1="89" x2="700" y2="89" class="wire"/>

  <circle cx="195" cy="89" r="5" class="node p1"/>
  <circle cx="420" cy="89" r="5" class="node2 p2"/>
  <circle cx="645" cy="89" r="5" class="node p3"/>

  <text x="220" y="70" class="sub">request</text>
  <text x="445" y="70" class="sub">invoke</text>
  <text x="670" y="70" class="sub">read / write</text>

  <rect x="25" y="151" width="850" height="3" rx="1.5" fill="url(#accent)" opacity=".7"/>
</svg>